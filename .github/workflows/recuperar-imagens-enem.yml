name: Recuperar imagens ENEM 2022 e 2023

on:
  workflow_dispatch:
  push:
    branches:
      - revisao/auditoria-enem-2022-2023
    paths:
      - .github/workflows/recuperar-imagens-enem.yml

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch do PR
        uses: actions/checkout@v4
        with:
          ref: revisao/auditoria-enem-2022-2023
          fetch-depth: 0
      - name: Recuperar imagens ausentes e atualizar JSONs
        run: python3 scripts/recuperar_imagens_enem.py
      - name: Enviar imagens e JSONs para a branch do PR
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/2022 imagens/2023 questoes/enem_2022.json questoes/enem_2023.json
          git commit -m "Recupera imagens originais do ENEM 2022 e 2023"
          git push origin HEAD:revisao/auditoria-enem-2022-2023
