<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado ENEM Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div id="menu-screen">
            <h1>🎓 Simulado ENEM</h1>
            <p class="subtitle">Banco de questões (2009 - 2025)</p>

            <div class="config-box">
                <p class="section-title">1. Escolha o Ano:</p>
                <div class="year-grid" id="year-buttons"></div>
                <p id="loading-msg" style="display:none; color:#e67e22; font-weight:bold; margin-top:10px;">🔄 Lendo prova...</p>
            </div>

            <div class="config-box" id="box-materia" style="opacity: 0.5; pointer-events: none;">
                <p class="section-title">2. Filtre por Matéria:</p>
                <div class="mode-selector subject-selector" id="mat-buttons-container">
                    <p class="hint-text">Selecione um ano acima para ver as matérias.</p>
                </div>
            </div>

            <div class="config-box" id="box-qtd" style="opacity: 0.5; pointer-events: none;">
                <p class="section-title">3. Quantidade:</p>
                <div class="mode-selector" id="qtd-selector">
                    <button class="mode-btn active" onclick="selecionarQtd(10, this)">🚀 10</button>
                    <button class="mode-btn" onclick="selecionarQtd(30, this)">⏱️ 30</button>
                    <button class="mode-btn" onclick="selecionarQtd(60, this)">🧠 60</button>
                    <button class="mode-btn" onclick="selecionarQtd('all', this)">📝 Todas</button>
                </div>
            </div>

            <div class="config-box" id="box-tempo">
                <p class="section-title">4. Modo de realização:</p>
                <select id="timer-mode" aria-label="Modo de tempo do simulado" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff;">
                    <option value="cronometrado" selected>⏱️ Com cronômetro — 3 minutos por questão</option>
                    <option value="livre">♾️ Tempo livre — sem contagem regressiva</option>
                </select>
            </div>

            <button id="start-btn" class="big-start-btn" disabled onclick="irParaQuiz()">SELECIONE O ANO</button>
        </div>

        <div id="quiz-active" style="display: none;">
            <div class="quiz-header">
                <div id="timer-display">00:00</div>
                <h2 id="prova-titulo">Prova</h2>
            </div>
            <p class="progress-text" id="progress">Carregando...</p>
            <hr>
            <div id="quiz-container"></div>
            <button id="next-btn" onclick="verificarEProxima()">Próxima Questão ›</button>
        </div>

        <div id="result-container" style="display: none;">
            <h1>Resultado Final</h1>
            <div class="score-big" id="final-score">0/0</div>
            <p class="score-details" id="final-feedback"></p>
            <button id="restart-btn" onclick="location.reload()">Novo Simulado</button>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="melhorias.js?v=20261102-video-links"></script>
</body>
</html>
